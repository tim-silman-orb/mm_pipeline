[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-pipeline-2"
version = "0.1.0"
description = "Conservative scriptable orchestration for the existing media-monitoring backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
telegram = ["telethon>=1.37"]
dev = ["pytest>=8.3"]

[project.scripts]
mm-pipeline = "mm_pipeline_2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

